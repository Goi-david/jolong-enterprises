<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Manager - Jolong Enterprises</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-navy: #0a1a3a;
            --primary-gold: #f4c430;
            --warm-cream: #fdf8f0;
            --gray: #6b7280;
            --shadow-sm: 0 2px 15px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 5px 25px rgba(0, 0, 0, 0.12);
            --border-radius-md: 12px;
            --border-radius-lg: 20px;
            --transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --gold-gradient: linear-gradient(135deg, #f4c430, #d4a820);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--warm-cream);
            padding-top: 80px;
        }

        .upload-zone {
            border: 3px dashed #dee2e6;
            border-radius: var(--border-radius-lg);
            padding: 60px 40px;
            text-align: center;
            transition: var(--transition);
            cursor: pointer;
            background: white;
        }

        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: var(--primary-gold);
            background: rgba(244, 196, 48, 0.02);
        }

        .upload-zone .icon {
            font-size: 4rem;
            color: var(--gray);
            margin-bottom: 16px;
        }

        .upload-zone h5 {
            color: var(--primary-navy);
        }

        .upload-zone p {
            color: var(--gray);
        }

        .file-item {
            background: white;
            border-radius: var(--border-radius-md);
            padding: 16px 20px;
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
            margin-bottom: 12px;
        }

        .file-item:hover {
            box-shadow: var(--shadow-md);
        }

        .file-item .file-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .file-item .file-info .file-icon {
            font-size: 2rem;
            color: var(--primary-gold);
            width: 50px;
            text-align: center;
        }

        .file-item .file-info .file-name {
            font-weight: 500;
        }

        .file-item .file-info .file-size {
            font-size: 0.8rem;
            color: var(--gray);
        }

        .progress-bar-custom {
            height: 6px;
            background: #e9ecef;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar-custom .progress-fill {
            height: 100%;
            background: var(--gold-gradient);
            border-radius: 3px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .btn-gold {
            background: var(--gold-gradient);
            color: var(--primary-navy);
            border: none;
            border-radius: 50px;
            padding: 10px 28px;
            font-weight: 600;
            transition: var(--transition);
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(244, 196, 48, 0.3);
            color: var(--primary-navy);
        }

        @media (max-width: 768px) {
            .upload-zone {
                padding: 40px 20px;
            }
            .file-item {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
            .file-item .file-info {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row">
            <div class="col-lg-10 mx-auto">
                <h2 class="mb-4" style="font-family:'Playfair Display',serif;font-weight:800;color:var(--primary-navy);">
                    <i class="fas fa-upload" style="color:var(--primary-gold);"></i> File Manager
                </h2>

                <!-- Upload Zone -->
                <div class="upload-zone" id="uploadZone">
                    <div class="icon"><i class="fas fa-cloud-upload-alt"></i></div>
                    <h5>Drop files here or click to upload</h5>
                    <p>Supported formats: JPG, PNG, GIF, PDF, DOC, XLS, MP4</p>
                    <input type="file" id="fileInput" multiple style="display:none;" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.mp4">
                    <button class="btn-gold mt-3" onclick="document.getElementById('fileInput').click()">
                        <i class="fas fa-folder-open"></i> Browse Files
                    </button>
                </div>

                <!-- File List -->
                <div class="mt-4">
                    <h5 class="mb-3"><i class="fas fa-list"></i> Uploaded Files</h5>
                    <div id="fileList">
                        <div class="file-item">
                            <div class="file-info">
                                <span class="file-icon"><i class="fas fa-file-image"></i></span>
                                <div>
                                    <div class="file-name">jolong-logo.png</div>
                                    <div class="file-size">245 KB • 2 days ago</div>
                                </div>
                            </div>
                            <div>
                                <button class="btn btn-sm btn-outline-primary me-1"><i class="fas fa-eye"></i></button>
                                <button class="btn btn-sm btn-outline-danger"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                        <div class="file-item">
                            <div class="file-info">
                                <span class="file-icon"><i class="fas fa-file-pdf"></i></span>
                                <div>
                                    <div class="file-name">farming-report-2026.pdf</div>
                                    <div class="file-size">1.2 MB • 5 days ago</div>
                                </div>
                            </div>
                            <div>
                                <button class="btn btn-sm btn-outline-primary me-1"><i class="fas fa-eye"></i></button>
                                <button class="btn btn-sm btn-outline-danger"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                        <div class="file-item">
                            <div class="file-info">
                                <span class="file-icon"><i class="fas fa-file-video"></i></span>
                                <div>
                                    <div class="file-name">ferry-promo.mp4</div>
                                    <div class="file-size">15.7 MB • 1 week ago</div>
                                </div>
                            </div>
                            <div>
                                <button class="btn btn-sm btn-outline-primary me-1"><i class="fas fa-eye"></i></button>
                                <button class="btn btn-sm btn-outline-danger"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');

        // Click to upload
        uploadZone.addEventListener('click', () => fileInput.click());

        // Drag and drop
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                handleFiles(e.dataTransfer.files);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFiles(e.target.files);
                fileInput.value = '';
            }
        });

        function handleFiles(files) {
            for (let file of files) {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                const iconMap = {
                    'image': 'fa-file-image',
                    'pdf': 'fa-file-pdf',
                    'doc': 'fa-file-word',
                    'xls': 'fa-file-excel',
                    'video': 'fa-file-video'
                };
                let icon = 'fa-file';
                if (file.type.startsWith('image/')) icon = 'fa-file-image';
                else if (file.type === 'application/pdf') icon = 'fa-file-pdf';
                else if (file.type.includes('word')) icon = 'fa-file-word';
                else if (file.type.includes('excel')) icon = 'fa-file-excel';
                else if (file.type.startsWith('video/')) icon = 'fa-file-video';

                const size = (file.size / 1024).toFixed(1) + ' KB';
                if (file.size > 1024 * 1024) {
                    size = (file.size / (1024 * 1024)).toFixed(1) + ' MB';
                }

                fileItem.innerHTML = `
                    <div class="file-info">
                        <span class="file-icon"><i class="fas ${icon}"></i></span>
                        <div>
                            <div class="file-name">${file.name}</div>
                            <div class="file-size">${size} • Just now</div>
                        </div>
                    </div>
                    <div>
                        <div class="progress-bar-custom" style="width:120px;">
                            <div class="progress-fill" style="width:100%;"></div>
                        </div>
                    </div>
                `;
                document.getElementById('fileList').prepend(fileItem);
                showToast('📁 File uploaded: ' + file.name);
            }
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed; bottom: 30px; right: 30px;
                background: var(--primary-navy); color: white;
                padding: 16px 24px; border-radius: 12px;
                box-shadow: var(--shadow-md);
                z-index: 9999;
                border-left: 4px solid var(--primary-gold);
                transform: translateX(500px);
                transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
                max-width: 400px;
                font-family: 'Poppins', sans-serif;
            `;
            toast.innerHTML = `<i class="fas fa-check-circle" style="color:var(--primary-gold);margin-right:10px;"></i> ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.style.transform = 'translateX(0)', 100);
            setTimeout(() => {
                toast.style.transform = 'translateX(500px)';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        console.log('📁 File Manager - Upload files, manage assets');
    </script>
</body>
</html>
